  <script src="../script.js?v=20261125d"></script>

  <script>
  /* ===================================================================
     THE PUZZLE
     ===================================================================
     Everything you need to edit lives in STAGES and FINAL below.
     Nothing else in this file needs touching.

     Each stage:
       title   - the stage's label (I, II, III ... or anything)
       lines   - cryptic preamble, one string per line
       cipher  - the ciphertext block, shown in a monospace panel
       hint    - revealed after 3 wrong attempts (set to "" for no hint)
       answer  - THE ANSWER, stored as a SHA-256 hash, not plain text,
                 so nobody can just read it in "view source"

     To generate a hash for a new answer, open the browser console on
     this page and run:

         await hashAnswer("your answer here")

     ...then paste the result into the stage's `answer` field. Matching
     ignores case, spaces and punctuation, so "The Path" == "thepath".
     =================================================================== */

  const STAGES = [
    {
      title: "I",
      lines: [
        "A word is hidden here.",
        "Caesar knew it. Shift three back.",
      ],
      cipher: "EHJLQ WKH KXQW",
      hint: "Each letter has walked three places forward. Walk it back.",
      // PLACEHOLDER answer = "begin the hunt"
      answer: "ee0ee4223028990afc3916b1f09bc162cbe548c74f5bb1cebcd32139ed3ce4fd",
    },
    {
      title: "II",
      lines: [
        "Numbers are only letters wearing coats.",
        "Count from the beginning.",
      ],
      cipher: "20-8-5  19-5-3-15-14-4  7-1-20-5",
      hint: "1 = A. Keep going.",
      // PLACEHOLDER answer = "the second gate"
      answer: "9fe7aaac834ac2aafb31933e786a995a86619d8fc805cbfe47c77c79ff56b16b",
    },
    {
      title: "III",
      lines: [
        "The last door has no lock.",
        "It only asks who you are.",
      ],
      cipher: ".-- .... --- / .- .-. . / -.-- --- ..-",
      hint: "Dots and dashes. The oldest alphabet on a wire.",
      // PLACEHOLDER answer = "who are you"
      answer: "8d60ef6493681058f91527d87216100570b87e1593a1e55fcb5de5bdc0cd620b",
    },
  ];

  // shown after the final stage is solved — the payoff
  const FINAL = {
    title: "IIII",
    lines: [
      "You found it.",
      "",
      "HAPPY BIRTHDAY.",
      "",
      "(replace this with the real message — a place, a time, a password)",
    ],
  };

  /* ===== engine — no need to edit below this line ===================== */
  (function cicada() {
    const stageEl = document.getElementById("cipherStage");
    const finalEl = document.getElementById("cipherFinal");
    const progEl  = document.getElementById("cipherProgress");
    const resetEl = document.getElementById("cipherReset");
    if (!stageEl || !finalEl) return;

    const KEY = "cicadaProgress";
    const norm = (s) => s.toLowerCase().replace(/[^a-z0-9]/g, "");

    // exposed so you can generate hashes from the console
    window.hashAnswer = async function (text) {
      const buf = new TextEncoder().encode(norm(text));
      const digest = await crypto.subtle.digest("SHA-256", buf);
      return [...new Uint8Array(digest)].map((b) => b.toString(16).padStart(2, "0")).join("");
    };

    let solved = 0;
    try { solved = Math.min(parseInt(localStorage.getItem(KEY), 10) || 0, STAGES.length); } catch (e) {}
    let attempts = 0;

    function save() { try { localStorage.setItem(KEY, String(solved)); } catch (e) {} }

    function renderFinal() {
      stageEl.hidden = true;
      finalEl.hidden = false;
      progEl.textContent = "complete";
      finalEl.innerHTML = "";
      const h = document.createElement("p");
      h.className = "cipher-stage-no";
      h.textContent = FINAL.title;
      finalEl.appendChild(h);
      for (const line of FINAL.lines) {
        const p = document.createElement("p");
        p.className = "cipher-line";
        p.textContent = line;
        if (!line) p.innerHTML = "&nbsp;";
        finalEl.appendChild(p);
      }
      finalEl.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 900, easing: "cubic-bezier(0.22,1,0.36,1)", fill: "both" });
    }

    function render() {
      if (solved >= STAGES.length) return renderFinal();
      const s = STAGES[solved];
      attempts = 0;
      stageEl.hidden = false;
      finalEl.hidden = true;
      progEl.textContent = `stage ${solved + 1} of ${STAGES.length}`;

      stageEl.innerHTML = "";
      const no = document.createElement("p");
      no.className = "cipher-stage-no";
      no.textContent = s.title;
      stageEl.appendChild(no);

      for (const line of s.lines) {
        const p = document.createElement("p");
        p.className = "cipher-line";
        p.textContent = line;
        stageEl.appendChild(p);
      }

      const pre = document.createElement("pre");
      pre.className = "cipher-text";
      pre.textContent = s.cipher;
      stageEl.appendChild(pre);

      const form = document.createElement("form");
      form.className = "cipher-form";
      form.innerHTML =
        '<input class="cipher-input" type="text" autocomplete="off" autocapitalize="off" ' +
        'spellcheck="false" placeholder="enter the key" aria-label="Enter the answer" />' +
        '<button class="pill cipher-submit" type="submit">submit</button>';
      stageEl.appendChild(form);

      const msg = document.createElement("p");
      msg.className = "cipher-msg";
      stageEl.appendChild(msg);

      const input = form.querySelector(".cipher-input");
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const guess = input.value.trim();
        if (!guess) return;
        const ok = (await window.hashAnswer(guess)) === s.answer;
        if (ok) {
          msg.className = "cipher-msg is-good";
          msg.textContent = "correct.";
          form.querySelector(".cipher-submit").disabled = true;
          input.disabled = true;
          await stageEl.animate([{ opacity: 1 }, { opacity: 0 }],
            { duration: 650, delay: 550, easing: "cubic-bezier(0.22,1,0.36,1)", fill: "both" }).finished;
          solved++; save();
          render();
          stageEl.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 700, easing: "cubic-bezier(0.22,1,0.36,1)", fill: "both" });
        } else {
          attempts++;
          msg.className = "cipher-msg is-bad";
          msg.textContent = attempts >= 3 && s.hint ? s.hint : "not it.";
          stageEl.animate(
            [{ transform: "translateX(0)" }, { transform: "translateX(-8px)" }, { transform: "translateX(8px)" }, { transform: "translateX(0)" }],
            { duration: 320, easing: "ease" }
          );
          input.select();
        }
      });
      input.focus({ preventScroll: true });
    }

    resetEl.addEventListener("click", () => {
      solved = 0; save();
      stageEl.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 600, fill: "both" });
      render();
    });

    render();
  })();
  </script>
