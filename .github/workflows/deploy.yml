name: Deploy to GitHub Pages

on:
  # deploy on every push to main
  push:
    branches: [main]
  # allow manual runs from the Actions tab
  workflow_dispatch:

# permissions the Pages deployment needs
permissions:
  contents: read
  pages: write
  id-token: write

# only one deploy at a time; don't cancel an in-progress one
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v6

      # Pinned to v4 on purpose — do NOT bump to v5 until deploy-pages catches up.
      # upload-pages-artifact@v5 uploads through actions/upload-artifact@v7, which
      # speaks the new artifact Results protocol, while deploy-pages (v5.0.1, the
      # newest) still lists artifacts with @actions/artifact ^2.x. The two can't
      # see each other, so the upload succeeds and the deploy then fails with
      # "No artifacts named github-pages were found". v4 pins upload-artifact
      # @v4.6.2, which matches the client deploy-pages actually uses.
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          # the whole repo root is the site (index.html lives here)
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
