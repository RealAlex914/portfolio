name: Deploy to GitHub Pages

on:
  # deploy on every push to main
  push:
    branches: [main]
  # allow manual runs from the Actions tab
  workflow_dispatch:

# permissions the Pages deployment needs.
# Declaring this block sets every unlisted scope to "none", so actions:read
# must be explicit — without it deploy-pages cannot list the run's artifacts
# and fails with "No artifacts named github-pages were found" even though the
# upload step succeeded.
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

# only one deploy at a time; don't cancel an in-progress one
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Keep these on current majors. GitHub retired the Node 20 runner, which
      # forced the older action versions onto Node 24 and broke the handoff
      # between upload-pages-artifact and deploy-pages ("No artifacts named
      # github-pages were found"). Pinning further back will start failing again.
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          # the whole repo root is the site (index.html lives here)
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
