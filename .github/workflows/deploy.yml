name: Deploy to GitHub Pages

on:
  # deploy on every push to main
  push:
    branches: [main]
  # allow manual runs from the Actions tab
  workflow_dispatch:

# permissions the Pages deployment needs
permissions:
  contents: read
  actions: read      # lets the wait step poll this run's artifacts
  pages: write
  id-token: write

# only one deploy at a time; don't cancel an in-progress one
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      # whichever attempt actually deployed
      url: ${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy3.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v6

      # ---------------------------------------------------------------------
      # Why v4 is pinned, and why the deploy is attempted several times:
      #
      # deploy-pages reads artifacts with @actions/artifact ^2.x. The only
      # uploader still on that protocol is upload-artifact@v4, which targets
      # Node 20 -- a runtime GitHub retired -- so it gets force-run on Node 24.
      # That mismatch makes the handoff intermittently fail with "No artifacts
      # named github-pages were found", even though the upload reports success
      # and the artifact is visible over the REST API moments later.
      #
      # Do NOT "upgrade" this: every newer uploader (v5 -> artifact ^4,
      # v6 -> ^5, v7 -> ^6) speaks a protocol deploy-pages cannot read, so it
      # fails 100% of the time instead of intermittently. Revisit only once
      # deploy-pages ships support for the newer artifact protocol.
      # ---------------------------------------------------------------------
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          # the whole repo root is the site (index.html lives here)
          path: '.'

      # The failure is a visibility race, so give the artifact time to register
      # before asking deploy-pages to find it.
      - name: Wait for the artifact to register
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          for i in $(seq 1 24); do
            n=$(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts" \
                  --jq '[.artifacts[] | select(.name=="github-pages")] | length' 2>/dev/null || echo 0)
            if [ "${n:-0}" -ge 1 ]; then
              echo "artifact registered after ~$((i*5))s; letting it settle"
              sleep 20
              exit 0
            fi
            sleep 5
          done
          echo "::warning::artifact never showed up in the REST listing; trying the deploy anyway"

      - name: Deploy to GitHub Pages
        id: deploy1
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Back off before retrying
        if: steps.deploy1.outcome == 'failure'
        run: sleep 45

      - name: Deploy to GitHub Pages (attempt 2)
        id: deploy2
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Back off before the final attempt
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 90

      # no continue-on-error: if this one fails too, fail the job
      - name: Deploy to GitHub Pages (final attempt)
        id: deploy3
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v5
